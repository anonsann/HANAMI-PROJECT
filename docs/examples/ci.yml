name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (zero-warning policy)
        run: npx eslint . --max-warnings 0

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx vite build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
