# Copy this file to .github/workflows/ci.yml to activate CI
# (creating workflow files requires a token with the `workflows` permission):
#   mkdir -p .github/workflows && cp docs/examples/ci.yml .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (clean — guards against lockfile drift, see SOD-013)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (zero-warning policy)
        run: npx eslint . --max-warnings 0

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx vite build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
